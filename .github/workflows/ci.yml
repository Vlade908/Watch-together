name: CI - Watch Together Monorepo

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-ci:
    name: Node.js CI (Web, Server, Database)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watch_together
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d watch_together"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/watch_together?schema=public"
      REDIS_URL: "redis://localhost:6379"
      PORT: 4000
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      NEXT_PUBLIC_WS_URL: "ws://localhost:4000"

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Instalação de dependências
        run: npm ci

      - name: 🗄️ Geração do Prisma Client
        run: npm run db:generate

      - name: 🔍 Verificação estática de tipos (Typecheck)
        run: npm run typecheck

      - name: 🧹 Linting (se configurado)
        run: npm run lint --if-present

      - name: 🔨 Compilação do Servidor Fastify
        run: npm run server:build

      - name: 🚀 Build de produção do Frontend Next.js
        run: npm run build --workspace=@watch-together/web

  python-ml-ci:
    name: Python ML CI (Recommender Service)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "watch-together-ml/requirements.txt"

      - name: 📦 Instalação de dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r watch-together-ml/requirements.txt

      - name: 🧪 Validação sintática e compilação de bytecode
        run: |
          python -m py_compile watch-together-ml/src/*.py watch-together-ml/src/**/*.py

  docker-build-check:
    name: Docker Build Validation (ML Container)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐳 Build da imagem Docker do microsserviço ML
        run: docker build -t watch-together-ml:ci-test watch-together-ml/
